[project]
name = "recordscrape"
version = "1.0.0"
description = "Record a browser session once, then scrape it on a schedule."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "selenium>=4.49.0",
    "webdriver-manager>=4.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
