<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Product Recorder - Control Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🎬 Video Product Recorder</h1>
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span class="status-text">Browser Offline</span>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Control Panel -->
            <div class="control-panel">
                <div class="card">
                    <h2>Browser Settings</h2>
                    <div class="form-group">
                        <label for="browserType">Browser Type</label>
                        <select id="browserType">
                            <option value="chromium">Chromium</option>
                            <option value="firefox">Firefox</option>
                            <option value="webkit">WebKit</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="headless">
                            Headless Mode
                        </label>
                    </div>
                    <div class="form-group">
                        <label for="viewport">Viewport Size</label>
                        <div class="viewport-inputs">
                            <input type="number" id="viewportWidth" value="1920" placeholder="Width">
                            <span>×</span>
                            <input type="number" id="viewportHeight" value="1080" placeholder="Height">
                        </div>
                    </div>
                    <div class="button-group">
                        <button id="launchBtn" class="btn btn-primary">🚀 Launch Browser</button>
                        <button id="closeBtn" class="btn btn-danger" disabled>🛑 Close Browser</button>
                    </div>
                </div>

                <div class="card">
                    <h2>Navigation</h2>
                    <div class="form-group">
                        <label for="urlInput">URL</label>
                        <input type="url" id="urlInput" placeholder="https://example.com">
                    </div>
                    <div class="form-group">
                        <label for="waitUntil">Wait Until</label>
                        <select id="waitUntil">
                            <option value="networkidle">Network Idle</option>
                            <option value="load">Load</option>
                            <option value="domcontentloaded">DOM Content Loaded</option>
                        </select>
                    </div>
                    <button id="navigateBtn" class="btn btn-primary" disabled>🌐 Navigate</button>
                </div>

                <div class="card">
                    <h2>Actions</h2>
                    <div class="form-group">
                        <label for="selectorInput">CSS Selector</label>
                        <input type="text" id="selectorInput" placeholder="#button, .class, h1">
                    </div>
                    <div class="form-group">
                        <label for="textInput">Text (for fill action)</label>
                        <input type="text" id="textInput" placeholder="Enter text here">
                    </div>
                    <div class="button-group">
                        <button id="clickBtn" class="btn btn-secondary" disabled>👆 Click</button>
                        <button id="fillBtn" class="btn btn-secondary" disabled>✍️ Fill</button>
                        <button id="screenshotBtn" class="btn btn-secondary" disabled>📸 Screenshot</button>
                    </div>
                </div>
            </div>

            <!-- Activity Log -->
            <div class="activity-panel">
                <div class="card">
                    <h2>Activity Log</h2>
                    <div id="activityLog" class="activity-log"></div>
                    <button id="clearLogBtn" class="btn btn-small">Clear Log</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
